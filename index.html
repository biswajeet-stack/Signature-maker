<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omspace Email Signature Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }
        .form-section, .preview-section {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            flex: 1;
            min-width: 350px;
        }
        h2 {
            margin-top: 0;
            color: #12102e;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }
        /* Styling for the locked, read-only fields */
        input[readonly] {
            background-color: #e9ecef;
            color: #6c757d;
            cursor: not-allowed;
            border: 1px solid #d1d3e2;
        }
        button {
            background-color: #00e5ff;
            color: #12102e;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            margin-top: 20px;
        }
        button:hover {
            background-color: #00b3cc;
        }
        .preview-box {
            border: 1px dashed #ccc;
            padding: 20px;
            margin-top: 20px;
            background: #fff;
            overflow-x: auto;
            display: flex;
            justify-content: center;
            min-height: 150px;
        }
    </style>
</head>
<body onload="updateSignature()">

    <div class="container">
        <!-- Input Form -->
        <div class="form-section">
            <h2>Enter Your Details</h2>
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="inpName" value="John Doe" oninput="updateSignature()">
            </div>
            <div class="form-group">
                <label>Job Title</label>
                <input type="text" id="inpTitle" value="Sales & Marketing Director" oninput="updateSignature()">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="inpPhone" value="(800) 555-0199" oninput="updateSignature()">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="inpEmail" value="john.doe@omspacerocket.com" oninput="updateSignature()">
            </div>

            <!-- Pre-filled and locked fields -->
            <hr style="border: 0; border-top: 1px solid #eee; margin: 25px 0;">
            <p style="font-size: 12px; color: #888; margin-top: 0;">Company details are locked automatically.</p>

            <div class="form-group">
                <label>Company Name</label>
                <input type="text" value="Omspace Rocket and Exploration Pvt. Ltd." readonly>
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" value="Floor 12, BLOCK-C, Ambli Rd, East Face, Ambli, Ahmedabad, Gujarat 380058" readonly>
            </div>
            <div class="form-group">
                <label>Website URL</label>
                <input type="text" value="www.omspacerocket.com" readonly>
            </div>
            
            <div class="form-group" style="display:none;">
                <label>Logo Image URL</label>
                <!-- Hidden to keep the logo constant, but can be unhidden if needed -->
                <input type="text" id="inpLogo" value="https://static.wixstatic.com/media/20373b_d8b8bf404999470396ac52a7171ef0aa~mv2.png/v1/fill/w_296,h_41,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/full_logo.png">
            </div>

            <button onclick="copySignature()">Copy Signature for Gmail</button>
        </div>

        <!-- Live Preview -->
        <div class="preview-section">
            <h2>Live Preview</h2>
            <p style="font-size: 14px; color: #666;">This is exactly how it will look in your email.</p>
            
            <div class="preview-box">
                <!-- Signature gets injected here dynamically -->
                <div id="signature-container"></div>
            </div>
        </div>
    </div>

    <script>
        function updateSignature() {
            // Get user-editable inputs
            const name = document.getElementById('inpName').value || ' ';
            const title = document.getElementById('inpTitle').value || ' ';
            const phone = document.getElementById('inpPhone').value || ' ';
            const email = document.getElementById('inpEmail').value || ' ';
            
            // Fixed Company Information (cannot be changed by user)
            const company = 'Omspace Rocket and Exploration Pvt. Ltd.';
            const address = 'Floor 12, BLOCK-C, Ambli Rd, East Face, Ambli, Ahmedabad, Gujarat 380058';
            const website = 'www.omspacerocket.com';
            const websiteUrl = 'http://www.omspacerocket.com';
            
            const defaultLogo = 'https://static.wixstatic.com/media/20373b_d8b8bf404999470396ac52a7171ef0aa~mv2.png/v1/fill/w_296,h_41,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/full_logo.png';
            const logo = document.getElementById('inpLogo').value || defaultLogo;

            // Single Classic Dark Template
            const htmlTemplate = `
                <table cellpadding="0" cellspacing="0" border="0" style="background-color: hsl(244, 48%, 22%); color: #ffffff; font-family: Arial, sans-serif; padding: 12px; width: 100%; max-width: 480px;">
                    <tr>
                        <td width="130" valign="middle" style="padding-right: 12px;">
                            <img src="${logo}" alt="Logo" style="display: block; max-width: 120px; height: auto;">
                        </td>
                        <td valign="middle">
                            <table cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
                                <tr>
                                    <td style="font-size: 15px; font-weight: bold; padding-bottom: 2px; color: #ffffff;">${name}</td>
                                </tr>
                                <tr>
                                    <td style="font-size: 11px; padding-bottom: 8px; color: #ffffff;">${title}</td>
                                </tr>
                                <tr>
                                    <td style="font-size: 10px; line-height: 1.4; white-space: nowrap;">
                                        <span style="color: #00e5ff; font-weight: bold;">Phone:</span> <span style="color: #ffffff;">${phone}</span><br>
                                        <span style="color: #00e5ff; font-weight: bold;">Email:</span> <a href="mailto:${email}" style="color: #ffffff; text-decoration: none;">${email}</a>
                                    </td>
                                </tr>
                                <tr><td style="padding-top: 8px;"></td></tr>
                                <tr>
                                    <td style="font-size: 10px; line-height: 1.3;">
                                        <span style="color: #ffffff;">${company}</span><br>
                                        <span style="color: #ffffff;">${address}</span><br>
                                        <a href="${websiteUrl}" style="color: #00e5ff; text-decoration: none;">${website}</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>`;

            // Inject the template into the DOM
            document.getElementById('signature-container').innerHTML = htmlTemplate;
        }

        function copySignature() {
            const signatureContainer = document.getElementById('signature-container');
            const range = document.createRange();
            range.selectNode(signatureContainer);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            
            try {
                document.execCommand('copy');
                alert('Signature copied to clipboard! You can now paste it directly into your Gmail Signature settings.');
            } catch (err) {
                alert('Failed to copy. Please manually select the signature and copy it.');
            }
            selection.removeAllRanges(); 
        }
    </script>
</body>
</html>
