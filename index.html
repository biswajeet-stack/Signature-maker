<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Signature Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }
        .form-section, .preview-section {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            flex: 1;
            min-width: 300px;
        }
        h2 {
            margin-top: 0;
            color: #12102e;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            background-color: #00e5ff;
            color: #12102e;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
            margin-top: 20px;
        }
        button:hover {
            background-color: #00b3cc;
        }
        .preview-box {
            border: 1px dashed #ccc;
            padding: 20px;
            margin-top: 20px;
            background: #fff;
            overflow-x: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Input Form -->
        <div class="form-section">
            <h2>Enter Your Details</h2>
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="inpName" value="John Doe" oninput="updateSignature()">
            </div>
            <div class="form-group">
                <label>Job Title</label>
                <input type="text" id="inpTitle" value="Sales & Marketing Director" oninput="updateSignature()">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="inpPhone" value="(800) 555-0199" oninput="updateSignature()">
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" id="inpMobile" value="(800) 555-0299" oninput="updateSignature()">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="inpEmail" value="john.doe@my-company.com" oninput="updateSignature()">
            </div>
            <div class="form-group">
                <label>Company Name</label>
                <input type="text" id="inpCompany" value="My Company" oninput="updateSignature()">
            </div>
            <div class="form-group">
                <label>Address</label>
                <input type="text" id="inpAddress" value="Street, City, Zip Code, Country" oninput="updateSignature()">
            </div>
            <div class="form-group">
                <label>Website URL</label>
                <input type="text" id="inpWebsite" value="www.my-company.com" oninput="updateSignature()">
            </div>
            <div class="form-group">
                <label>Logo Image URL</label>
                <input type="text" id="inpLogo" value="https://static.wixstatic.com/media/20373b_d8b8bf404999470396ac52a7171ef0aa~mv2.png/v1/fill/w_296,h_41,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/full_logo.png" oninput="updateSignature()">
            </div>

            <button onclick="copySignature()">Copy Signature for Gmail</button>
        </div>

        <!-- Live Preview -->
        <div class="preview-section">
            <h2>Live Preview</h2>
            <p style="font-size: 14px; color: #666;">This is exactly how it will look in your email.</p>
            
            <div class="preview-box">
                <!-- Signature Container -->
                <div id="signature-container">
                    <!-- Increased max-width here to 800px to prevent text wrapping -->
                    <table cellpadding="0" cellspacing="0" border="0" style="background-color: #12102e; color: #ffffff; font-family: Arial, sans-serif; padding: 25px; width: 100%; max-width: 800px;">
                        <tr>
                            <!-- Left Column: Logo -->
                            <td width="220" valign="middle" style="padding-right: 25px;">
                                <img id="sigLogo" src="https://static.wixstatic.com/media/20373b_d8b8bf404999470396ac52a7171ef0aa~mv2.png/v1/fill/w_296,h_41,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/full_logo.png" alt="Logo" style="display: block; max-width: 200px; height: auto;">
                            </td>
                            
                            <!-- Right Column: Text Details -->
                            <td valign="middle">
                                <table cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
                                    <tr>
                                        <td id="sigName" style="font-size: 20px; font-weight: bold; padding-bottom: 4px; color: #ffffff;">John Doe</td>
                                    </tr>
                                    <tr>
                                        <td id="sigTitle" style="font-size: 15px; padding-bottom: 18px; color: #ffffff;">Sales & Marketing Director</td>
                                    </tr>
                                    <tr>
                                        <td style="font-size: 13px; line-height: 1.6; white-space: nowrap;">
                                            <span style="color: #00e5ff; font-weight: bold;">Phone:</span> <span id="sigPhone" style="color: #ffffff;">(800) 555-0199</span> 
                                            <span style="color: #00e5ff; font-weight: bold; margin-left: 8px;">Mobile:</span> <span id="sigMobile" style="color: #ffffff;">(800) 555-0299</span><br>
                                            <span style="color: #00e5ff; font-weight: bold;">Email:</span> <a id="sigEmail" href="mailto:john.doe@my-company.com" style="color: #ffffff; text-decoration: none;">john.doe@my-company.com</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="padding-top: 18px;"></td>
                                    </tr>
                                    <tr>
                                        <td style="font-size: 13px; line-height: 1.5; color: #ffffff;">
                                            <span id="sigCompany">My Company</span><br>
                                            <span id="sigAddress">Street, City, Zip Code, Country</span><br>
                                            <a id="sigWebsite" href="http://www.my-company.com" style="color: #00e5ff; text-decoration: none;">www.my-company.com</a>
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateSignature() {
            document.getElementById('sigName').innerText = document.getElementById('inpName').value || ' ';
            document.getElementById('sigTitle').innerText = document.getElementById('inpTitle').value || ' ';
            document.getElementById('sigPhone').innerText = document.getElementById('inpPhone').value || ' ';
            document.getElementById('sigMobile').innerText = document.getElementById('inpMobile').value || ' ';
            
            let email = document.getElementById('inpEmail').value;
            let emailElem = document.getElementById('sigEmail');
            emailElem.innerText = email || ' ';
            emailElem.href = "mailto:" + email;

            document.getElementById('sigCompany').innerText = document.getElementById('inpCompany').value || ' ';
            document.getElementById('sigAddress').innerText = document.getElementById('inpAddress').value || ' ';
            
            let website = document.getElementById('inpWebsite').value;
            let websiteElem = document.getElementById('sigWebsite');
            websiteElem.innerText = website || ' ';
            websiteElem.href = website.startsWith('http') ? website : "http://" + website;

            let logoUrl = document.getElementById('inpLogo').value;
            document.getElementById('sigLogo').src = logoUrl || 'https://static.wixstatic.com/media/20373b_d8b8bf404999470396ac52a7171ef0aa~mv2.png/v1/fill/w_296,h_41,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/full_logo.png';
        }

        function copySignature() {
            const signatureContainer = document.getElementById('signature-container');
            const range = document.createRange();
            range.selectNode(signatureContainer);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            
            try {
                document.execCommand('copy');
                alert('Signature copied to clipboard! You can now paste it directly into your Gmail Signature settings.');
            } catch (err) {
                alert('Failed to copy. Please manually select the signature and copy it.');
            }
            selection.removeAllRanges(); 
        }
    </script>
</body>
</html>
